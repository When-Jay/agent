# 前端站点 + /api 反向代理：浏览器只访问 web 端口，API 经 nginx 同源转发。
# ${VAR} 由 nginx 官方镜像的 envsubst 启动脚本渲染（Dockerfile ENV 提供默认值）。
# 边缘限流：这里是最外层入口，$binary_remote_addr 即用户真实 IP；应用层的
# Redis 限流（RATE_LIMIT_RPM）在反代后只能按代理 IP 计数，仅作第二道防线。
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=${NGINX_API_RATE};

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退（/admin/*、/app/* 均由前端路由接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代；SSE 事件流必须关闭缓冲，否则事件会被攒包
    location /api/ {
        limit_req zone=api_per_ip burst=${NGINX_API_BURST} nodelay;
        limit_req_status 429;
        client_max_body_size ${NGINX_MAX_BODY_SIZE};

        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 生产 TLS 示例（挂载证书后启用；同源下前端与 API 共用证书）：
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
}
