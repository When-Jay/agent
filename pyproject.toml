[project]
name = "ai-runtime-platform"
version = "0.1.0"
description = "Enterprise-oriented AI runtime platform foundation."
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "redis",
    "uvicorn",
    "langgraph",
    "langchain",
    "deepagents",
    "celery",
    "mcp",
    "langfuse",
    "docker",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
